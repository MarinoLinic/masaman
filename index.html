	// Convert RGB to Hex
	function rgbToHex(r, g, b) {
		return (
			'#' +
			[r, g, b]
				.map((x) => x.toString(16).padStart(2, '0')) // Convert to hex and ensure 2 digits
				.join('')
		)
	}

	// Find color name from RGB
	function rgbToNameOrHex(r, g, b) {
		const hex = rgbToHex(r, g, b)
		for (const [name, colorHex] of Object.entries(colorNames)) {
			if (colorHex.toLowerCase() === hex.toLowerCase()) {
				return name // Return the color name if found
			}
		}
		return hex // Otherwise, return the hex code
	}

	// Get color on click
	canvas.addEventListener('click', function (event) {
		const rect = canvas.getBoundingClientRect()
		const x = event.clientX - rect.left
		const y = event.clientY - rect.top

		const pixel = ctx.getImageData(x, y, 1, 1).data
		const r = pixel[0],
			g = pixel[1],
			b = pixel[2]

		const tooltip = document.createElement('div')
		tooltip.textContent = rgbToNameOrHex(r, g, b)
		Object.assign(tooltip.style, {
			position: 'absolute',
			left: `${event.pageX + 5}px`,
			top: `${event.pageY + 5}px`,
			background: 'black',
			color: 'white',
			padding: '4px 8px',
			borderRadius: '4px',
			fontSize: '12px',
			pointerEvents: 'none',
		})

		document.body.appendChild(tooltip)
		setTimeout(() => tooltip.remove(), 1500) // Auto-remove after 1.5 sec
	})
