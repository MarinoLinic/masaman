<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Color-coded map workflow</title><desc id="desc">Workflow diagram: Original map then Filter exact colors then Inspect the map.</desc><rect width="960" height="270" rx="12" fill="#f6f3ec"/><text x="30" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#222">Color-coded map workflow</text><rect x="30" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="30" y="78" width="280" height="6" rx="3" fill="#265564"/><text x="48" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Original map</text><text x="48" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">old-map.png</text><text x="48" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Existing categorical palette</text><path d="M318 153h13m-5-5 5 5-5 5" fill="none" stroke="#265564" stroke-width="2"/><rect x="340" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="340" y="78" width="280" height="6" rx="3" fill="#265564"/><text x="358" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Filter exact colors</text><text x="358" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Pillow + Colors in main.py</text><text x="358" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Other pixels become transparent</text><path d="M628 153h13m-5-5 5 5-5 5" fill="none" stroke="#265564" stroke-width="2"/><rect x="650" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="650" y="78" width="280" height="6" rx="3" fill="#265564"/><text x="668" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Inspect the map</text><text x="668" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">filtered_map.png in canvas</text><text x="668" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Hover, zoom, pan and pin</text></svg>
